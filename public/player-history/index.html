<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player History</title>
  <link rel="stylesheet" href="/player-history/player-history.css" />
</head>
<body>
  <h1>Player History</h1>

  <div class="tables-wrapper">
    <section class="table-section">
      <div class="section-header">
        <h2>Players</h2>
        <button id="loadPlayersButton" type="button">
          Load Players
        </button>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Player ID</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="playersTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="table-section">
      <div class="section-header">
        <h2>Player History</h2>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Previous Team</th>
              <th></th>
              <th>Current Team</th>
              <th>First Game Date</th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <section class="stats-update-section">
    <h2>Player Stats Update</h2>

    <p>
      Uses currently loaded players from the grid. Each click updates the next 20 players.
    </p>

    <button id="playerStatsUpdateButton" type="button" disabled>
      Player stats update
    </button>

    <div id="playerStatsUpdateStatus"></div>
  </section>

  <p><a href="/">Nazad na Home</a></p>

  <script src="/player-history/player-history.js"></script>
</body>
</html>
